<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - Art Gallery</title>
    <link rel="stylesheet" href="style (1).css">
</head>

<body>
    <header class="header">
        <p>Welcome</p>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="index.html#about">About</a></li>
                <li><a href="index.html#gallery">Gallery</a></li>
                <li><a href="contact.html" class="active">Contact</a></li>
            </ul>
        </nav>
    </header>

    <section class="contact-section">
        <div class="container">
            <h1 class="title">Get In Touch</h1>

            <div class="contact-wrapper">
                <!-- معلومات التواصل -->
                <div class="contact-info">
                    <h3>Contact Information</h3>
                    <p><strong>Email:</strong> hello@artgallery.com</p>
                    <p><strong>Phone:</strong> +20 123 456 7890</p>
                    <p><strong>Address:</strong> Art Street, Safaga, Red Sea, Egypt</p>
                    <p><strong>Working Hours:</strong> Mon - Fri, 9:00 AM - 5:00 PM</p>
                </div>

                <!-- فورم التواصل -->
                <div class="contact-form">
                    <form id="contactForm">
                        <input type="text" placeholder="Your Name" required>
                        <input type="email" placeholder="Your Email" required>
                        <textarea placeholder="Your Message" rows="5" required></textarea>
                        <button type="submit" class="btn">Send Message</button>
                    </form>
                </div>
            </div>
        </div>
    </section>

    <footer class="footer">
        <p>Made with ❤️ | All rights reserved &copy; 2026</p>
    </footer>

    <!-- سكريبت بسيط بيطلع رسالة شكر لما اليوزر يبعت الفورم -->
    <script>
        document.getElementById('contactForm').addEventListener('submit', function (e) {
            e.preventDefault(); // بيمنع الصفحة تعمل ريفريش
            alert('Thank you for reaching out! We will get back to you soon.');
            this.reset(); // بيفضي الفورم بعد الإرسال
        });
    </script>
</body>

</html>
